<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cleaning Schedule</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>Cleaning Schedule</h1>

     <form action="/cleaners/add" method="post">
            <input type="text" name="name" placeholder="Name" required>
            <button type="submit">Add Cleaner</button>
    </form>

    <div class="cleaner-list">
        <strong>Cleaners:</strong>
        <ul>
            {% for cleaner in cleaners %}
                <li>{{ cleaner }}</li>
            {% endfor %}
        </ul>
    </div>

    <table>
        <thead>
        <tr>
            <th>Apartment</th>
            <th>Assigned Cleaner</th>
        </tr>
        </thead>
        <tbody>
        {% for unit in units %}
            <tr>
                <td>{{ unit }}</td>
                <td>
                    <select name="cleaner_for_{{ loop.index }}">
                        <option value="">-- Select cleaner --</option>
                        {% for cleaner in cleaners %}
                            <option value="{{ cleaner }}">{{ cleaner }}</option>
                        {% endfor %}
                    </select>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</body>
</html>
